name: Ship final verified Pi parity release

on:
  push:
    branches:
      - agent/pi-parity-tui
    paths:
      - .ship-pi-parity-final
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: cascade-final-pi-parity-ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_BRANCH: agent/pi-parity-tui-clean
    steps:
      - name: Resolve current clean pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          MAIN_VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=main" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          if [[ "$MAIN_VERSION" == "0.3.0" ]]; then
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/branches/${CLEAN_BRANCH}" >/dev/null
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CLEAN_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR" ]]; then
            URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CLEAN_BRANCH" \
              --title "Restore Pi parity and add native Cascade TUI setup" \
              --body "Cascade 0.3.0 preserves native Pi capabilities and adds role-aware setup through the tested terminal UI.")"
            PR="${URL##*/}"
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Require all clean-branch checks and merge
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          EXPECTED=(
            "Node 22.19.0 on ubuntu-latest"
            "Node 24 on ubuntu-latest"
            "Node 22.19.0 on macos-latest"
            "Node 22.19.0 on windows-latest"
            "Install exact repository commit from GitHub"
            "Analyze JavaScript"
            "Native Pi TUI parity"
          )
          for attempt in $(seq 1 210); do
            HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
            JSON="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            missing=0; pending=0; failed=0
            for name in "${EXPECTED[@]}"; do
              entry="$(echo "$JSON" | jq -c --arg name "$name" '[.check_runs[] | select(.name == $name)] | last // empty')"
              if [[ -z "$entry" ]]; then missing=1; continue; fi
              status="$(echo "$entry" | jq -r .status)"
              conclusion="$(echo "$entry" | jq -r '(.conclusion // "pending")')"
              [[ "$status" == "completed" ]] || pending=1
              if [[ "$status" == "completed" && ! "$conclusion" =~ ^(success|neutral|skipped)$ ]]; then failed=1; fi
            done
            if [[ "$failed" == "1" ]]; then
              echo "$JSON" | jq -r '.check_runs[] | "\(.name): \(.status) / \(.conclusion // "pending")"'
              echo "Required check failure; refusing to merge."
              exit 1
            fi
            if [[ "$missing" == "0" && "$pending" == "0" ]]; then
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "All Cascade 0.3.0 gates passed on the current head: Linux Node 22/24, macOS, Windows, exact GitHub-source installation, stable native PTY TUI parity, and CodeQL."
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --admin --delete-branch
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for clean-branch checks."
          exit 1

      - name: Resolve merged main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=main" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
            if [[ "$VERSION" == "0.3.0" ]]; then break; fi
            sleep 5
          done
          test "$VERSION" = "0.3.0"
          echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" >> "$GITHUB_OUTPUT"

      - name: Require all main-branch checks
        shell: bash
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          EXPECTED=(
            "Node 22.19.0 on ubuntu-latest"
            "Node 24 on ubuntu-latest"
            "Node 22.19.0 on macos-latest"
            "Node 22.19.0 on windows-latest"
            "Install exact repository commit from GitHub"
            "Analyze JavaScript"
            "Native Pi TUI parity"
          )
          for attempt in $(seq 1 210); do
            JSON="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${MAIN_SHA}/check-runs?per_page=100")"
            missing=0; pending=0; failed=0
            for name in "${EXPECTED[@]}"; do
              entry="$(echo "$JSON" | jq -c --arg name "$name" '[.check_runs[] | select(.name == $name)] | last // empty')"
              if [[ -z "$entry" ]]; then missing=1; continue; fi
              status="$(echo "$entry" | jq -r .status)"
              conclusion="$(echo "$entry" | jq -r '(.conclusion // "pending")')"
              [[ "$status" == "completed" ]] || pending=1
              if [[ "$status" == "completed" && ! "$conclusion" =~ ^(success|neutral|skipped)$ ]]; then failed=1; fi
            done
            [[ "$failed" == "0" ]] || exit 1
            if [[ "$missing" == "0" && "$pending" == "0" ]]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Publish Cascade 0.3.0
        shell: bash
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.3.0" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v0.3.0' -f sha="$MAIN_SHA" >/dev/null
          fi
          if ! gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.3.0 --repo "$GITHUB_REPOSITORY" --target "$MAIN_SHA" --generate-notes --title "Cascade 0.3.0"
          fi
          gh pr comment 8 --repo "$GITHUB_REPOSITORY" --body "Superseded by the clean, fully validated Cascade 0.3.0 Pi-parity release."
          gh pr close 8 --repo "$GITHUB_REPOSITORY" || true

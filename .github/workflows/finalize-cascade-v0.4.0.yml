name: Finalize Cascade v0.4.0

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'agent/cascade-0.4-release' && github.event.pull_request.title == 'Finalize Cascade v0.4.0 release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Verify and publish v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.4.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/v0.4.0 >/dev/null; then
            test "$(git rev-list -n1 v0.4.0)" = "$(git rev-parse HEAD)"
          else
            git config user.name "TanushV"
            git config user.email "87838540+TanushV@users.noreply.github.com"
            git tag -a v0.4.0 -m "Cascade v0.4.0"
            git push origin v0.4.0
          fi
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release edit v0.4.0 \
              --title "Cascade v0.4.0" \
              --notes "Standalone Cascade application built on the Pi engine. Isolated Cascade state and extensions, Cascade-owned TUI identity, native worker behavior, independently configurable expert orchestration, global compaction controls, and in-place updates."
          else
            gh release create v0.4.0 \
              --title "Cascade v0.4.0" \
              --notes "Standalone Cascade application built on the Pi engine. Isolated Cascade state and extensions, Cascade-owned TUI identity, native worker behavior, independently configurable expert orchestration, global compaction controls, and in-place updates."
          fi

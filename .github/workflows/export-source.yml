name: Export source for local TUI development

on:
  push:
    branches:
      - agent/native-pi-tui-parity
    paths:
      - .export-source
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/native-pi-tui-parity' || github.ref_name == 'agent/native-pi-tui-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build local-development archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' --exclude='./dist' -czf "$RUNNER_TEMP/cascade-source.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: cascade-source
          path: ${{ runner.temp }}/cascade-source.tgz
          if-no-files-found: error
          retention-days: 1

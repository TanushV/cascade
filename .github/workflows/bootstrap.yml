name: Materialize verified source tree

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract tested source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          cat .bootstrap/chunk-* | tr -d '\n' | base64 --decode > /tmp/pi-cascade-source.tar.gz
          echo "2ea552b01521022c9972b93ad6b2c889b91dbe4f9c64589e0051eb38a57e4c95  /tmp/pi-cascade-source.tar.gz" | sha256sum --check --strict
          rm -rf /tmp/pi-cascade-source
          mkdir -p /tmp/pi-cascade-source
          tar -xzf /tmp/pi-cascade-source.tar.gz -C /tmp/pi-cascade-source
          rsync -a --delete --exclude=.git --exclude=.bootstrap /tmp/pi-cascade-source/source/ ./
          if [[ -d .bootstrap/overlays ]]; then
            rsync -a .bootstrap/overlays/ ./
          fi
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Source tree is already materialized."
            exit 0
          fi
          git commit -m "Materialize verified Pi Cascade source"
          git push origin HEAD:main

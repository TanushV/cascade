name: Apply Cascade 0.3 source

on:
  push:
    branches:
      - agent/cascade-0.3-native-pi
    paths:
      - .publish/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.3-native-pi
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Materialize and validate clean source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/chunk-* | base64 --decode > "$RUNNER_TEMP/cascade-source.tar.gz"
          echo "78b36e6318866d69acdb8c58523c33a3bcf938b01d1bab85576b73cfde3c52d9  $RUNNER_TEMP/cascade-source.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cascade-source"
          tar -xzf "$RUNNER_TEMP/cascade-source.tar.gz" -C "$RUNNER_TEMP/cascade-source"
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/cascade-source/" ./
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Restore native Pi parity and add tested Cascade TUI"
          git push origin HEAD:agent/cascade-0.3-native-pi

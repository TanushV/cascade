name: Finalize Pi parity and TUI

on:
  push:
    branches:
      - agent/pi-parity-tui
    paths:
      - .finalize-pi-parity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cascade-pi-parity-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pi-parity-tui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Apply or complete migration
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == "0.2.0" ]]; then
            node --check scripts/apply-pi-parity-tui-v2.mjs
            node scripts/apply-pi-parity-tui-v2.mjs
          fi
          node --check scripts/finalize-pi-parity.mjs
          node scripts/finalize-pi-parity.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate complete runtime and real PTY flow
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
          npm run tui:smoke
      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .apply-pi-parity .finalize-pi-parity
          rm -f scripts/apply-pi-parity-tui.mjs scripts/apply-pi-parity-tui-v2.mjs scripts/finalize-pi-parity.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No finalization changes were needed."
          else
            git commit -m "Finalize Pi parity and Cascade TUI"
            git push origin HEAD:agent/pi-parity-tui
          fi

name: Export Cascade source

on:
  push:
    branches:
      - agent/cascade-0.4-work
    paths:
      - .export-cascade-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf "$RUNNER_TEMP/cascade-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: cascade-source
          path: ${{ runner.temp }}/cascade-source.tar.gz
          if-no-files-found: error
          retention-days: 1

name: Ship verified Pi parity release retry

on:
  push:
    branches:
      - agent/pi-parity-tui
    paths:
      - .ship-pi-parity-retry
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: cascade-pi-parity-ship-retry
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_BRANCH: agent/pi-parity-tui-clean
    steps:
      - name: Merge clean branch when main is not yet 0.3.0
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          main_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=main" --jq .content | tr -d '\n' | base64 -d | jq -r .version
          }
          if [[ "$(main_version)" == "0.3.0" ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already=false" >> "$GITHUB_OUTPUT"

          gh api "repos/${GITHUB_REPOSITORY}/branches/${CLEAN_BRANCH}" >/dev/null
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CLEAN_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR" ]]; then
            URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CLEAN_BRANCH" \
              --title "Restore Pi parity and add native Cascade TUI setup" \
              --body "Preserve all native Pi capabilities and add role-aware Cascade setup through the tested terminal UI.")"
            PR="${URL##*/}"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          EXPECTED=(
            "Node 22.19.0 on ubuntu-latest"
            "Node 24 on ubuntu-latest"
            "Node 22.19.0 on macos-latest"
            "Node 22.19.0 on windows-latest"
            "Install exact repository commit from GitHub"
            "Analyze JavaScript"
            "Native Pi TUI parity"
          )
          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)"
          for attempt in $(seq 1 180); do
            JSON="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            missing=0; pending=0; failed=0
            for name in "${EXPECTED[@]}"; do
              count="$(echo "$JSON" | jq --arg name "$name" '[.check_runs[] | select(.name == $name)] | length')"
              if [[ "$count" == "0" ]]; then missing=1; continue; fi
              status="$(echo "$JSON" | jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | last | .status')"
              conclusion="$(echo "$JSON" | jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | last | (.conclusion // "pending")')"
              [[ "$status" == "completed" ]] || pending=1
              if [[ "$status" == "completed" && ! "$conclusion" =~ ^(success|neutral|skipped)$ ]]; then failed=1; fi
            done
            if [[ "$failed" == "1" ]]; then
              echo "$JSON" | jq -r '.check_runs[] | "\(.name): \(.status) / \(.conclusion // "pending")"'
              exit 1
            fi
            if [[ "$missing" == "0" && "$pending" == "0" ]]; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "All Cascade 0.3.0 cross-platform, exact-install, native PTY TUI, parity, and CodeQL gates passed."
              gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --admin --delete-branch
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Resolve and verify merged main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=main" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
            if [[ "$VERSION" == "0.3.0" ]]; then break; fi
            sleep 5
          done
          test "$VERSION" = "0.3.0"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for complete main verification
        shell: bash
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          EXPECTED=(
            "Node 22.19.0 on ubuntu-latest"
            "Node 24 on ubuntu-latest"
            "Node 22.19.0 on macos-latest"
            "Node 22.19.0 on windows-latest"
            "Install exact repository commit from GitHub"
            "Analyze JavaScript"
            "Native Pi TUI parity"
          )
          for attempt in $(seq 1 180); do
            JSON="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${MAIN_SHA}/check-runs?per_page=100")"
            missing=0; pending=0; failed=0
            for name in "${EXPECTED[@]}"; do
              count="$(echo "$JSON" | jq --arg name "$name" '[.check_runs[] | select(.name == $name)] | length')"
              if [[ "$count" == "0" ]]; then missing=1; continue; fi
              status="$(echo "$JSON" | jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | last | .status')"
              conclusion="$(echo "$JSON" | jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | last | (.conclusion // "pending")')"
              [[ "$status" == "completed" ]] || pending=1
              if [[ "$status" == "completed" && ! "$conclusion" =~ ^(success|neutral|skipped)$ ]]; then failed=1; fi
            done
            [[ "$failed" == "0" ]] || exit 1
            if [[ "$missing" == "0" && "$pending" == "0" ]]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Publish verified release
        shell: bash
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.3.0" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v0.3.0' -f sha="$MAIN_SHA" >/dev/null
          fi
          if ! gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.3.0 --repo "$GITHUB_REPOSITORY" --target "$MAIN_SHA" --generate-notes --title "Cascade 0.3.0"
          fi
          gh pr comment 8 --repo "$GITHUB_REPOSITORY" --body "Superseded by the clean, fully validated Cascade 0.3.0 Pi-parity implementation."
          gh pr close 8 --repo "$GITHUB_REPOSITORY" || true

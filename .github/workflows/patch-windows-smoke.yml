name: One-time Windows smoke patch

on:
  push:
    branches:
      - agent/rename-cascade-fix-ci
    paths:
      - .patch-windows-smoke

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rename-cascade-fix-ci
          fetch-depth: 0
      - name: Correct npm global shim locations on Windows
        run: |
          node <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "scripts/package-smoke.mjs";
          let text = await readFile(path, "utf8");
          const oldGlobal = 'const globalCli = join(globalPrefix, "bin", process.platform === "win32" ? "cascade.cmd" : "cascade");';
          const newGlobal = `const globalCli = process.platform === "win32"
            ? join(globalPrefix, "cascade.cmd")
            : join(globalPrefix, "bin", "cascade");`;
          const oldGit = 'const gitCli = join(gitPrefix, "bin", process.platform === "win32" ? "cascade.cmd" : "cascade");';
          const newGit = `const gitCli = process.platform === "win32"
            ? join(gitPrefix, "cascade.cmd")
            : join(gitPrefix, "bin", "cascade");`;
          if (!text.includes(oldGlobal) || !text.includes(oldGit)) {
            throw new Error("Expected global shim path expressions were not found");
          }
          text = text.replace(oldGlobal, newGlobal).replace(oldGit, newGit);
          await writeFile(path, text, "utf8");
          NODE
          rm -f .patch-windows-smoke
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/package-smoke.mjs .patch-windows-smoke
          git commit -m "Fix Windows npm global shim paths"
          git push origin HEAD:agent/rename-cascade-fix-ci

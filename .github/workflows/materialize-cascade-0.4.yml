name: Diagnose Cascade 0.4 materialization

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/cascade-0.4-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Record every reconstruction stage
        shell: bash
        run: |
          set +e
          set -o pipefail
          exec > >(tee .publish/diagnostic.txt) 2>&1

          stage() {
            local name="$1"
            shift
            echo "===== $name ====="
            "$@"
            local code=$?
            echo "STATUS $name=$code"
            return 0
          }

          echo "HEAD=$(git rev-parse HEAD)"
          echo "BASE_FILES=$(git ls-files | wc -l)"
          ls -l .publish

          stage concatenate_patch bash -c 'cat .publish/current-*.b64 | base64 --decode > "$RUNNER_TEMP/cascade.patch.gz"'
          stage patch_digest sha256sum "$RUNNER_TEMP/cascade.patch.gz"
          stage patch_digest_check bash -c 'echo "f3817e3b59825bef1b944c09e706dd73c8c163cc46d0a0a4340bfea3a64128b3  $RUNNER_TEMP/cascade.patch.gz" | sha256sum --check --strict'
          stage decompress_patch gunzip -c "$RUNNER_TEMP/cascade.patch.gz"
          gunzip -c "$RUNNER_TEMP/cascade.patch.gz" > "$RUNNER_TEMP/cascade.patch" 2>>.publish/diagnostic.txt
          echo "STATUS write_patch=$?"
          stage apply_check git apply --check --binary --exclude=.export-source --exclude=.github/workflows/export-source.yml "$RUNNER_TEMP/cascade.patch"
          stage apply_patch git apply --binary --exclude=.export-source --exclude=.github/workflows/export-source.yml "$RUNNER_TEMP/cascade.patch"

          stage concatenate_new bash -c 'cat .publish/new-*.b64 | base64 --decode > "$RUNNER_TEMP/cascade-new-files.tar.gz"'
          stage new_digest sha256sum "$RUNNER_TEMP/cascade-new-files.tar.gz"
          stage new_digest_check bash -c 'echo "7ac419cbb8ee41c9760d280f6ea97bc8540a41bc343832c1ff20578102bac6fa  $RUNNER_TEMP/cascade-new-files.tar.gz" | sha256sum --check --strict'
          stage list_new tar -tzf "$RUNNER_TEMP/cascade-new-files.tar.gz"
          stage extract_new tar -xzf "$RUNNER_TEMP/cascade-new-files.tar.gz" -C .

          stage node_version node --version
          stage npm_version npm --version
          stage npm_ci npm ci --ignore-scripts --no-audit --no-fund
          stage install_pexpect python3 -m pip install --user pexpect
          stage full_ci npm run ci

          git reset --quiet
          git add .publish/diagnostic.txt
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git commit -m "Record Cascade 0.4 materialization diagnostics"
          git push origin HEAD:agent/cascade-0.4-release
          exit 0

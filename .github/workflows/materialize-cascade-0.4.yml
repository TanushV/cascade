name: Materialize Cascade 0.4

on:
  push:
    branches:
      - agent/cascade-0.4-clean
    paths:
      - .publish/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-clean
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Materialize and validate Cascade
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/source-*.b64 | base64 --decode > "$RUNNER_TEMP/cascade-source.tar.gz"
          echo "a9aa573e63d7cd6dc5e6f427e2be12b56385cc8cf25f9879d8932ff6def321b2  $RUNNER_TEMP/cascade-source.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cascade-source"
          tar -xzf "$RUNNER_TEMP/cascade-source.tar.gz" -C "$RUNNER_TEMP/cascade-source"
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/cascade-source/" ./
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Ship Cascade 0.4 as an isolated application"
          git push origin HEAD:agent/cascade-0.4-clean

name: Materialize Cascade 0.4

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/cascade-0.4-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Reconstruct, validate, and publish the tested source tree
        shell: bash
        run: |
          set -euo pipefail

          cat .publish/current-*.b64 | base64 --decode > "$RUNNER_TEMP/cascade.patch.gz"
          echo "f3817e3b59825bef1b944c09e706dd73c8c163cc46d0a0a4340bfea3a64128b3  $RUNNER_TEMP/cascade.patch.gz" | sha256sum --check --strict
          gunzip -c "$RUNNER_TEMP/cascade.patch.gz" > "$RUNNER_TEMP/cascade.patch"
          git apply --binary \
            --exclude=.export-source \
            --exclude=.github/workflows/export-source.yml \
            "$RUNNER_TEMP/cascade.patch"

          cat .publish/new-*.b64 | base64 --decode > "$RUNNER_TEMP/cascade-new-files.tar.gz"
          echo "7ac419cbb8ee41c9760d280f6ea97bc8540a41bc343832c1ff20578102bac6fa  $RUNNER_TEMP/cascade-new-files.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cascade-new-files.tar.gz" -C .

          rm -rf .publish
          rm -f .github/workflows/materialize-cascade-0.4.yml

          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --user pexpect
          npm run ci

          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Ship isolated Cascade 0.4 application"
          git push origin HEAD:agent/cascade-0.4-release

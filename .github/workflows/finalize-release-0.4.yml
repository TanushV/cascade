name: Finalize Cascade 0.4 release

on:
  push:
    branches: [main]
    paths: [.finalize-release-0.4]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Validate, clean temporary release files, and tag clean commit
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if (p.version !== "0.4.0") process.exit(1)'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          rm -f .release-0.4 .finalize-release-0.4
          rm -f .github/workflows/tag-cascade-0.4.yml
          rm -f .github/workflows/finalize-release-0.4.yml
          git config user.name 'TanushV'
          git config user.email '87838540+TanushV@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Cascade 0.4 release'
          git push origin HEAD:main
          git tag -d v0.4.0 >/dev/null 2>&1 || true
          git push origin :refs/tags/v0.4.0 >/dev/null 2>&1 || true
          git tag -a v0.4.0 -m 'Cascade 0.4.0'
          git push origin v0.4.0

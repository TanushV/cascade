name: Apply Cascade rename

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cascade-rename-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rename:
    if: github.head_ref == 'agent/rename-cascade-fix-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Apply rename
        run: node scripts/rename-to-cascade.mjs
      - name: Commit generated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .rename-cascade
          rm -f .github/workflows/rename-cascade.yml
          rm -f .github/workflows/rename-cascade-pr.yml
          rm -f scripts/rename-to-cascade.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Rename project to Cascade and fix CI"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: Force clean Pi parity branch

on:
  push:
    branches:
      - agent/pi-parity-tui
    paths:
      - .force-clean-parity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cascade-force-clean-parity
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pi-parity-tui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Apply tolerant codemod and verify
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/force-pi-parity.mjs
          node scripts/force-pi-parity.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm run tui:smoke
      - name: Publish source-only clean branch
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cascade-forced-final"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude .git --exclude .github --exclude node_modules --exclude dist \
            --exclude '.apply-*' --exclude '.finalize-*' --exclude '.build-*' \
            --exclude '.merge-*' --exclude '.ship-*' --exclude '.repair-*' --exclude '.force-*' \
            --exclude scripts/apply-pi-parity-tui.mjs \
            --exclude scripts/apply-pi-parity-tui-v2.mjs \
            --exclude scripts/finalize-pi-parity.mjs \
            --exclude scripts/patch-parity-tests.mjs \
            --exclude scripts/force-pi-parity.mjs \
            ./ "$STAGE/"
          git fetch origin main
          git checkout -B agent/pi-parity-tui-clean origin/main
          rsync -a --delete --exclude .git --exclude .github --exclude node_modules "$STAGE/" ./
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm run tui:smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Restore Pi parity and add native Cascade TUI"
          git push --force origin HEAD:agent/pi-parity-tui-clean

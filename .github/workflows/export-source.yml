name: Export source snapshot

on:
  push:
    branches:
      - agent/pi-parity-tui
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/pi-parity-tui' || github.ref_name == 'agent/pi-parity-tui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf cascade-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: cascade-source
          path: cascade-source.tgz
          if-no-files-found: error
          retention-days: 1

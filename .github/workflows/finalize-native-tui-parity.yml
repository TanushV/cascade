name: Finalize native Pi TUI parity

on:
  push:
    branches:
      - agent/native-pi-tui-parity
    paths:
      - .finalize-native-tui-parity

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-native-pi-tui-parity
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_BRANCH: agent/native-pi-tui-parity-clean
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/native-pi-tui-parity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Confirm implementation is present
        shell: bash
        run: |
          set -euo pipefail
          test -f extension/core/tui-setup.mjs
          test -f extension/core/pi-parity.mjs
          test -f scripts/tui-smoke.py
          test "$(node -p "require('./package.json').version")" = "0.3.0"
      - name: Validate implementation branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
      - name: Build clean branch without temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git push origin --delete "$CLEAN_BRANCH" >/dev/null 2>&1 || true
          CLEAN="$RUNNER_TEMP/cascade-clean"
          git worktree add -b "$CLEAN_BRANCH" "$CLEAN" origin/main

          git diff --name-status origin/main...HEAD > "$RUNNER_TEMP/changes.txt"
          while IFS=$'\t' read -r status first second; do
            path="$first"
            if [[ "$status" == R* || "$status" == C* ]]; then path="$second"; fi
            case "$path" in
              .github/workflows/export-source.yml|.github/workflows/apply-native-tui-parity.yml|.github/workflows/finalize-native-tui-parity.yml|.export-source|.apply-native-tui-parity|.finalize-native-tui-parity|scripts/apply-native-tui-parity.mjs)
                continue
                ;;
            esac
            if [[ "$status" == D* ]]; then
              rm -rf "$CLEAN/$path"
            else
              mkdir -p "$CLEAN/$(dirname "$path")"
              cp -a "$GITHUB_WORKSPACE/$path" "$CLEAN/$path"
            fi
          done < "$RUNNER_TEMP/changes.txt"

          cd "$CLEAN"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Restore native Pi capabilities and add Cascade TUI setup"
          git push -u origin "$CLEAN_BRANCH"
      - name: Open, validate, and merge clean pull request
        shell: bash
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/pr-body.md"
          cat > "$BODY" <<'EOF'
          ## What changed

          - preserves Pi's native TUI, model picker, login flow, commands, keybindings, sessions, extensions, and active tools
          - adds `/cascade-setup`, `/cascade-model`, and `/cascade-auth` using Pi's own dialog and model-registry APIs
          - supports session, project, and global persistence without storing provider secrets in project configuration
          - keeps the current Pi model authoritative for the default worker and restores role-aware model switching
          - only restricts tools when `restrictTools` is explicitly enabled
          - adds unit coverage and a real pseudo-terminal TUI smoke test

          ## Validation

          - complete `npm run ci` suite on the implementation branch
          - complete `npm run ci` suite again from a clean branch based on `main`
          - native PTY launch, status rendering, `/cascade-setup` selector rendering, cancellation, and shutdown
          - Linux, macOS, Windows, Node 22/24, exact GitHub-source installation, and CodeQL through required PR checks
          EOF

          PR_URL="$(gh pr list --head "$CLEAN_BRANCH" --state open --json url --jq '.[0].url')"
          if [[ -z "$PR_URL" ]]; then
            PR_URL="$(gh pr create --base main --head "$CLEAN_BRANCH" --title "Restore native Pi capabilities and add Cascade TUI setup" --body-file "$BODY")"
          fi
          sleep 12
          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --admin --delete-branch \
            --subject "Restore native Pi capabilities and add Cascade TUI setup" \
            --body "Preserve native Pi behavior, add role-aware TUI setup and authentication handoff, and validate the actual terminal interaction across the complete CI matrix."
          gh pr close 9 --comment "Superseded by the clean, fully validated parity PR." || true

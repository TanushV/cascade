name: Finalize Cascade 0.4

on:
  push:
    branches:
      - agent/cascade-0.4-materialize
    paths:
      - .finalize/READY

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Verify, remove temporary publisher, and commit
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if (p.version !== "0.4.0") { console.error(`Expected Cascade 0.4.0, found ${p.version}`); process.exit(1); }'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          rm -rf .publish .finalize
          rm -f .github/workflows/materialize-cascade-0.4.yml
          rm -f .github/workflows/finalize-cascade-0.4.yml
          git config user.name 'TanushV'
          git config user.email '87838540+TanushV@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize isolated Cascade 0.4 source tree'
          git push origin HEAD:agent/cascade-0.4-materialize

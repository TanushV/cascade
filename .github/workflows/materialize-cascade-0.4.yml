name: Materialize Cascade 0.4

on:
  push:
    branches:
      - agent/cascade-0.4-isolated-app
    paths:
      - .publish/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-isolated-app
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Replace staging payload with verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/chunk-* | base64 --decode > "$RUNNER_TEMP/cascade-source.tar.gz"
          echo "87e6660f5867da721b9e8a748f812073dc9680c4b61fac9a9ee432c0144b36f8  $RUNNER_TEMP/cascade-source.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cascade-source"
          tar -xzf "$RUNNER_TEMP/cascade-source.tar.gz" -C "$RUNNER_TEMP/cascade-source"
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/cascade-source/" ./
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --user pexpect
          npm run ci
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Cascade as an isolated application"
          git push origin HEAD:agent/cascade-0.4-isolated-app

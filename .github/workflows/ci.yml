name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22.19.0
          - os: windows-latest
            node: 22.19.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test, static checks, legal checks, and package smoke tests
        run: npm run ci

  github-source-install:
    name: Install exact repository commit from GitHub
    runs-on: macos-latest
    timeout-minutes: 15
    needs: test
    env:
      INSTALL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Install and verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/cascade-prefix"
          npm install -g "git+https://github.com/${GITHUB_REPOSITORY}.git#${INSTALL_SHA}" \
            --prefix "$PREFIX" --ignore-scripts --no-audit --no-fund
          "$PREFIX/bin/cascade" --version
          "$PREFIX/bin/cascade" self-test
          "$PREFIX/bin/cascade" runtime

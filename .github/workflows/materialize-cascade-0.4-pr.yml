name: Materialize Cascade 0.4 PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/cascade-0.4-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Replace the release branch with the verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/source-*.b64 | base64 --decode > "$RUNNER_TEMP/cascade-source.tar.gz"
          echo "5b8f78dde762b54bd547d2d0e8ac1c2aa8b9a52bbcd261426f4bc91cc9500bb2  $RUNNER_TEMP/cascade-source.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cascade-source"
          tar -xzf "$RUNNER_TEMP/cascade-source.tar.gz" -C "$RUNNER_TEMP/cascade-source"
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/cascade-source/" ./
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --user pexpect
          npm run ci
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Ship isolated Cascade 0.4 application"
          git push origin HEAD:agent/cascade-0.4-release

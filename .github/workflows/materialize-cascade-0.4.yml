name: Materialize Cascade 0.4

on:
  push:
    branches:
      - agent/cascade-0.4-isolated-app
    paths:
      - .publish/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.4-isolated-app
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Apply and validate the verified Cascade patch
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/chunk-* | base64 --decode > "$RUNNER_TEMP/cascade.patch.gz"
          echo "c8a4418226a8ee3f8ccccd146557536fd2738d2848181f03c7add89d04792e15  $RUNNER_TEMP/cascade.patch.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/cascade.patch.gz" > "$RUNNER_TEMP/cascade.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/cascade.patch"
          rm -rf .publish .github/workflows/materialize-cascade-0.4.yml
          python3 -m pip install --user pexpect
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Ship Cascade 0.4 as an isolated application"
          git push origin HEAD:agent/cascade-0.4-isolated-app

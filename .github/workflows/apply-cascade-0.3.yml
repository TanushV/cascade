name: Apply Cascade 0.3 source

on:
  push:
    branches:
      - agent/cascade-0.3-native-pi
    paths:
      - .publish/READY
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/cascade-0.3-native-pi' || github.ref_name == 'agent/cascade-0.3-native-pi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cascade-0.3-native-pi
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Apply, validate, and publish the Cascade 0.3 runtime
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/chunk-* | base64 --decode > "$RUNNER_TEMP/cascade.patch.gz"
          echo "475dc084052be9975284a7099474a0788e301b65259c86cc61708ea6191bce3a  $RUNNER_TEMP/cascade.patch.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/cascade.patch.gz" > "$RUNNER_TEMP/cascade.patch"
          git apply --index "$RUNNER_TEMP/cascade.patch"

          # GITHUB_TOKEN may publish source but may not create or change workflow files.
          # Keep both workflows unchanged for this commit; the repository API installs
          # the already-tested final CI workflow and removes this helper afterward.
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml
          rm -rf .publish

          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          git config user.name "TanushV"
          git config user.email "87838540+TanushV@users.noreply.github.com"
          git add -A
          git commit -m "Restore native Pi parity and add tested Cascade TUI"
          git push origin HEAD:agent/cascade-0.3-native-pi
